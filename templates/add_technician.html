<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Technician | OSCAR ENGINEERS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fa;
            min-height: 100vh;
        }

        nav {
            background: #07111f;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 45px auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dde5;
            border-radius: 9px;
            font-size: 14px;
        }

        .submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #ffb300, #ff6f00);
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .error {
            background: #ffe8e8;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

    </style>

</head>

<body>

<nav>

    <div class="brand">
        🐯 OSCAR ENGINEERS
    </div>

    <a href="/technicians" class="back">
        ← Technicians
    </a>

</nav>


<div class="container">

    <div class="form-box">

        <h1>
            👨‍🔧 Add Technician
        </h1>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="group">

                <label>
                    Technician Name
                </label>

                <input
                    type="text"
                    name="name"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    name="mobile"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Specialization
                </label>

                <input
                    type="text"
                    name="specialization"
                    placeholder="AC Service / Installation / Repair"
                >

            </div>


            <div class="group">

                <label>
                    Technician Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Technician Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit"
            >
                Create Technician
            </button>

        </form>

    </div>

</div>

</body>

</html>
