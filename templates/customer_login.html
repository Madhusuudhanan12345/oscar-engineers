<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Login | Oscar Engineers</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071e3d,
                    #1261a0,
                    #00a8cc
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #1261a0,
                    #00a8cc
                );

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 36px;

            box-shadow:
                0 8px 20px
                rgba(18, 97, 160, 0.3);
        }

        h1 {
            color: #071e3d;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            color: #172033;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d9dfe8;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #1261a0;

            box-shadow:
                0 0 0 3px
                rgba(18, 97, 160, 0.12);
        }

        .login-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #1261a0,
                    #00a8cc
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(18, 97, 160, 0.3);
        }

        .error {
            background: #ffe8e8;

            color: #c62828;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .success {
            background: #e8f8ef;

            color: #16834a;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .signup {
            margin-top: 22px;

            color: #667085;

            font-size: 14px;
        }

        .signup a {
            color: #1261a0;

            font-weight: bold;

            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;

            margin-top: 20px;

            color: #667085;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #1261a0;
        }

        .service-text {
            margin-top: 20px;

            padding-top: 18px;

            border-top: 1px solid #eee;

            color: #777;

            font-size: 13px;

            line-height: 1.6;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">
            ❄️
        </div>


        <!-- TITLE -->

        <h1>
            Customer Login
        </h1>


        <p class="subtitle">
            Welcome to OSCAR ENGINEERS
        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="error">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <!-- SUCCESS MESSAGE -->

        {% if success %}

            <div class="success">
                ✅ {{ success }}
            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('customer_login') }}"
        >


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                🔐 Login
            </button>


        </form>


        <!-- SIGN UP -->

        <div class="signup">

            New customer?

            <a href="{{ url_for('customer_signup') }}">
                Create an Account
            </a>

        </div>


        <!-- HOME -->

        <a
            href="{{ url_for('home') }}"
            class="home-link"
        >
            ← Back to Home
        </a>


        <!-- FOOTER -->

        <div class="service-text">

            🛠️ AC Service & Installation

            <br>

            <strong>
                OSCAR ENGINEERS
            </strong>

        </div>


    </div>

</div>


</body>

</html>
