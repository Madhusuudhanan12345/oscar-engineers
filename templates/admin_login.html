<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - OSCAR ENGINEERS</title>

    <style>
        body {
            font-family: Arial;
            background: #07111f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            text-align: center;
        }

        h2 {
            color: #07111f;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #ffb300;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🐯 OSCAR ENGINEERS</h2>

    <h3>Admin Login</h3>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Admin Login
        </button>

    </form>

</div>

</body>
</html>
