<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book AC Service | OSCAR ENGINEERS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #eef7ff,
                #ffffff
            );
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(
                135deg,
                #071e3d,
                #1261a0
            );
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .home-btn {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.15);
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow:
                0 8px 30px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            color: #1261a0;
            margin-bottom: 8px;
        }

        .title p {
            color: #667085;
        }

        .section-title {
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8eef5;
            color: #1261a0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1261a0;
            box-shadow: 0 0 0 3px rgba(18,97,160,0.1);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .submit-area {
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn {
            border: none;
            background: linear-gradient(
                135deg,
                #1261a0,
                #159957
            );
            color: white;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .note {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ff;
            border-left: 4px solid #1261a0;
            border-radius: 8px;
            color: #405066;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>❄️ OSCAR ENGINEERS</h1>

    <a
        href="{{ url_for('home') }}"
        class="home-btn"
    >
        🏠 Home
    </a>

</header>


<div class="container">

    <div class="card">


        <div class="title">

            <h2>🔧 Book AC Service</h2>

            <p>
                Fill in your details and our team will contact you.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('book_service') }}"
        >


            <!-- CUSTOMER DETAILS -->

            <h3 class="section-title">
                👤 Customer Details
            </h3>


            <div class="grid">


                <div class="field">

                    <label>
                        Customer Name *
                    </label>

                    <input
                        type="text"
                        name="customer_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Mobile Number *
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        placeholder="Enter mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="field full">

                    <label>
                        Service Address *
                    </label>

                    <textarea
                        name="address"
                        placeholder="Enter complete service address"
                        required
                    ></textarea>

                </div>


            </div>


            <!-- AC DETAILS -->

            <h3 class="section-title">
                ❄️ AC Details
            </h3>


            <div class="grid">


                <div class="field">

                    <label>
                        AC Brand
                    </label>

                    <select name="ac_brand">

                        <option value="">
                            Select Brand
                        </option>

                        <option>
                            LG
                        </option>

                        <option>
                            Samsung
                        </option>

                        <option>
                            Daikin
                        </option>

                        <option>
                            Voltas
                        </option>

                        <option>
                            Blue Star
                        </option>

                        <option>
                            Panasonic
                        </option>

                        <option>
                            Hitachi
                        </option>

                        <option>
                            Carrier
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        AC Type
                    </label>

                    <select name="ac_type">

                        <option value="">
                            Select AC Type
                        </option>

                        <option>
                            Split AC
                        </option>

                        <option>
                            Window AC
                        </option>

                        <option>
                            Cassette AC
                        </option>

                        <option>
                            Duct AC
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Service Required
                    </label>

                    <select
                        name="service_type"
                        required
                    >

                        <option value="">
                            Select Service
                        </option>

                        <option>
                            AC General Service
                        </option>

                        <option>
                            AC Deep Cleaning
                        </option>

                        <option>
                            AC Installation
                        </option>

                        <option>
                            AC Uninstallation
                        </option>

                        <option>
                            AC Gas Filling
                        </option>

                        <option>
                            AC Repair
                        </option>

                        <option>
                            AC Water Leakage
                        </option>

                        <option>
                            AC Not Cooling
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


            </div>


            <!-- PREFERRED TIME -->

            <h3 class="section-title">
                📅 Preferred Service Time
            </h3>


            <div class="grid">


                <div class="field">

                    <label>
                        Preferred Date
                    </label>

                    <input
                        type="date"
                        name="preferred_date"
                    >

                </div>


                <div class="field">

                    <label>
                        Preferred Time
                    </label>

                    <select name="preferred_time">

                        <option value="">
                            Select Time
                        </option>

                        <option>
                            8:00 AM - 10:00 AM
                        </option>

                        <option>
                            10:00 AM - 12:00 PM
                        </option>

                        <option>
                            12:00 PM - 2:00 PM
                        </option>

                        <option>
                            2:00 PM - 4:00 PM
                        </option>

                        <option>
                            4:00 PM - 6:00 PM
                        </option>

                        <option>
                            6:00 PM - 8:00 PM
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Problem / Additional Details
                    </label>

                    <textarea
                        name="problem"
                        placeholder="Example: AC is not cooling, water leakage, unusual sound..."
                    ></textarea>

                </div>


            </div>


            <div class="note">

                💡 <strong>Important:</strong>

                After submitting the booking,
                you will receive a unique
                <strong>Booking ID</strong>.

                Please save it to track your service.

            </div>


            <div class="submit-area">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    🚀 Book My Service
                </button>

            </div>


        </form>

    </div>

</div>


</body>

</html>
